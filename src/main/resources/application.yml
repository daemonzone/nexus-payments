spring:
  application:
    name: nexus-payments
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments_db}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:nexus}
    password: ${RABBITMQ_PASSWORD:nexus}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms

payment:
  provider:
    base-url: ${PAYMENT_PROVIDER_BASE_URL:http://localhost:8084}
    connect-timeout: ${PAYMENT_PROVIDER_CONNECT_TIMEOUT:2000}
    read-timeout: ${PAYMENT_PROVIDER_READ_TIMEOUT:5000}

# HTTP-level resilience around the payment-provider call. This is separate
# from, and unaware of, the RabbitMQ listener retry above: this one recovers
# short HTTP hiccups within a single OrderCreated processing attempt; that
# one recovers whole-message processing failures across redeliveries. See
# README.md "HTTP resilience" section for the full picture.
resilience4j:
  retry:
    instances:
      paymentProvider:
        max-attempts: 4
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      paymentProvider:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        # A 4xx means OUR request was rejected (malformed/invalid) - it says
        # nothing about the provider's health, so it must not count as
        # evidence the provider is failing. Retry already never retries it
        # (see retry-exceptions above); this is the equivalent guard on the
        # circuit breaker's side, so a run of client-side bugs can't trip the
        # breaker and block otherwise-valid requests from healthy providers.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
